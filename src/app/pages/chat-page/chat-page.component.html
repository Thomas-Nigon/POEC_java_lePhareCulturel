<main class="chatPage">
  <section class="chatPage__container">
    <aside class="chatPage__container__aside">
      <article class="chatPage__container__aside__groupMember">
        <img
          class="chatPage__container__aside__avatarPic"
          src="/assets/images/avatars/avatar4.svg"
          alt="an avatar picture" />
        <p class="chatPage__container__aside__userName">userName</p>
      </article>
    </aside>

    <section class="chatPage__container__chatWindow">
      <app-single-message-card />
      <app-single-message-card />
      <app-single-message-card />
      <app-single-message-card />
      <app-single-message-card />
      <app-single-message-card />
      <app-single-message-card />
      <app-single-message-card />
      <div class="textarea__container">
        <textarea
          class="chatPage__container__chatWindow__textArea"
          name="userMessage"
          id="userMessage"
          placeholder="Ecrivez votre message"></textarea>
        <button class="chatPage__textarea__sendButton">
          <span class="material-symbols-outlined"> send</span>
        </button>
      </div>
    </section>
  </section>
</main>
