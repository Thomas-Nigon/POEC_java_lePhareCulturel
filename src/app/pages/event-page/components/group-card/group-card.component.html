<article class="groupCard">
  <h4 class="groupCard__title">{{ group.name }} <span>(4pers)</span></h4>

  <h5 class="groupCard__title5">Informations :</h5>
  <p>{{ group.description }}</p>
  <h5 class="groupCard__title5">Heure du rendez-vous :</h5>
  <p>{{ group.time }}</p>
  <h5 class="groupCard__title5">Membres du groupe :</h5>
  <div class="groupCard__membersList">
    <div class="groupCard__member" *ngFor="let member of group.members">
      <span class="groupCard__member__name">
        {{ member.firstname }}
      </span>
      <img class="groupCard__avatar" src="{{ member.picture }}" alt="a member avatar" />
    </div>
  </div>
  <!-- <button class="groupCard__button">Rejoindre</button> -->
  <button type="button" class="button-57" role="button">
    <span class="text">Rejoindre ce groupe</span><span>Rejoindre ce groupe</span>
  </button>
</article>
