<div class="event-card">
  <img
    class="event-image"
    src="{{ eventList ? eventList[eventId].event_pic : '' }}"
    alt="{{ eventList ? eventList[eventId].event_desc : '' }}" />
  <h2 class="event-title">{{ eventList ? eventList[eventId].event_name : '' }}</h2>

  {{ eventList ? eventList[eventId].event_desc : '' }}
  {{ eventList ? eventList[eventId].event_date : '' }}
  <h3 class="event-subtitle">Tarif</h3>
  <p class="event-paragraph">gratuit</p>
  <button class="event-button">Participer</button>

  <h2 class="event-subtitle">Participants</h2>

  <p>
    {{ eventList ? eventList[eventId].event_desc : '' }}
  </p>
</div>
