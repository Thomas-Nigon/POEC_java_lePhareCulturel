<article class="avatar">
  <h3>Mon avatar:</h3>
  <p>Choisissez un avatar pour votre profil.</p>
  <form [formGroup]="editAvatarForm" class="avatar__list">
    <div formArrayName="checkboxes">
      <button type="button" class="avatar__list__button" *ngFor="let avatar of avatarList">
        <img class="avatar__list__image" [src]="avatar.url" alt="Avatar" />
        <input (change)="updateCheckbox(avatar.id)" type="checkbox" [value]="avatar.url" />
      </button>
    </div>
    <button type="button" class="avatar__button">valider</button>
  </form>
</article>
