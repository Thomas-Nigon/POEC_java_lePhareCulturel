<main class="searchPage">
  <h2 class="search_page_title">L'Agenda du Phare</h2>
  <!--   <button (click)="getAllEventsBackend()">Rechercher tous les events</button>
  <button (click)="geteventById()">Rechercher single event</button>
  <button (click)="getGroupListByEvent()">Rechercher all groups of event</button>
  <button (click)="getSingleGroupByEvent()">Rechercher un groupe sur un event e</button>


 -->
  <app-filter-bar></app-filter-bar>
  <article class="calendar_title_container">
    <h3 class="calendar-title">
      {{ displayDate }}
      <button class="calendar-title__button" (click)="onClick()">
        <span *ngIf="isOpen" class="material-symbols-outlined"> arrow_circle_up </span>
        <span *ngIf="!isOpen" class="material-symbols-outlined"> arrow_circle_down </span>
      </button>
    </h3>
  </article>
  <div class="calendar-container" [ngClass]="{ close: !isOpen }">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
</main>

<div
  class="search-results"
  infiniteScroll
  [infiniteScrollDistance]="2"
  [infiniteScrollThrottle]="500"
  (scrolled)="onScroll()"
  [scrollWindow]="false">
  <app-event-card *ngFor="let event of eventList" [event]="event"></app-event-card>
</div>
