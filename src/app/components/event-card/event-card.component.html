<a routerLink="/event/{{ eventList ? eventList[3].id : '' }}" class="eventCard__link">
  <article class="eventCard">
    <img class="eventCard-img" src="{{ eventList ? eventList[3].event_pic : '' }}" alt="" />
    <div class="eventCard__description">
      <h3 class="eventCard__title">{{ eventList ? eventList[3].event_name : '' }}</h3>
      <p class="eventCard__date">
        {{ eventList ? eventList[3].event_date : '' }}
        <span class="eventCard__time">{{ eventList ? eventList[3].event_time : '' }}</span>
      </p>
      <p class="eventCard__description">{{ eventList ? eventList[3].event_desc : '' }}</p>
    </div>
  </article>
</a>
